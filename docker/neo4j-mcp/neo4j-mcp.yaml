services:
  neo4j-mcp:
    image: crisalidesr/crisalid-neo4j-mcp-toolbox
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - NEO4J_URI=bolt://${NEO4J_HOST}:${NEO4J_BOLT_PORT}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - KEYCLOAK_ISSUER=${KEYCLOAK_SCHEME}://${KEYCLOAK_HOST}:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5000/" ]
      interval: 30s
      retries: 5
      start_period: 10s
      timeout: 5s
    networks:
      - ikg-network
    profiles:
      - neo4j-mcp
networks:
  ikg-network:
    driver: bridge