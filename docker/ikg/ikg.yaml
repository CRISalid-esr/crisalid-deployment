services:
  crisalid-org-registry:
    # Overriden by environment specific YAML configurations (e.g. docker-compose.dev.yaml)
    # image: crisalidesr/crisalid-org-registry:1.0
    restart: unless-stopped
    expose:
      - 3000
    environment:
      - ORG_REGISTRY_URL=http://crisalid-org-registry:3000  # Match the URL used in your environment
      - REFRESH_ORG_REGISTRY=${REFRESH_ORG_REGISTRY:-"false"}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]  # Health check using curl
      interval: 120s
      retries: 5
      start_period: 30s
      timeout: 5s
    networks:
      - ikg-network
    volumes:
      - org_registry_pgdata:/var/lib/postgresql/data
    profiles:
      - ikg
  crisalid-ikg:
    # Overriden by environment specific YAML configurations (e.g. docker-compose.dev.yaml)
    # image: crisalidesr/crisalid-ikg:latest
    restart: unless-stopped
    # May be useful only for K8S health checks. REST API is not used elsewhere for now
    #    ports:
    #      - 8001:8000
    # or expose internally instead of publishing to host
    #    expose:
    #      - "8000"
    environment:
      # Overriden by environment specific YAML configurations (e.g. docker-compose.dev.yaml)
      # - APP_ENV=DEV
      - OPENALEX_TOPICS_TREE_PATH=/app/data/openalex
      - API_PREFIX=/api
      - API_VERSION=v1
      - AMQP_ENABLED=true
      - AMQP_HOST=${CRISALID_BUS_HOST:-crisalid-bus}
      - AMQP_PORT=${CRISALID_BUS_AMQP_PORT}
      - AMQP_USER=${CRISALID_BUS_USER}
      - AMQP_PASSWORD=${CRISALID_BUS_PASSWORD}
      - NEO4J_URI=bolt://${NEO4J_HOST}:${NEO4J_BOLT_PORT}
      #      - NEO4J_USER= #keep empty if NEO4J_AUTH=none
      #      - NEO4J_PASSWORD= #keep empty if NEO4J_AUTH=none
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - ES_ENABLED=false
      - ES_HOST=http://localhost
      - ES_PORT=9200
      - ES_USER=elastic
      - ES_PASSWORD=elastic
      - ORG_REGISTRY_URL=http://crisalid-org-registry:3000
      - HARVESTERS=${HARVESTERS:-"idref,scanr,hal,openalex,scopus"}
      - EMBEDDING_ENABLED=${EMBEDDING_ENABLED:-false}
      - EMBEDDING_PROVIDER=openai_compatible
      - EMBEDDING_API_URL=${EMBEDDING_API_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_API_MODEL=${EMBEDDING_API_MODEL:-}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-384}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
      - EMBEDDING_TIMEOUT_SECONDS=${EMBEDDING_TIMEOUT_SECONDS:-30}
      # Topics classification via crisalid-taxi (profile crisalid-taxi, same ikg-network)
      - TAXI_ENABLED=${TAXI_ENABLED:-false}
      - TAXI_API_URL=http://crisalid-taxi:8000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/healthness" ]
      interval: 10s
      retries: 5
      timeout: 5s
    depends_on:
      crisalid-bus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      crisalid-org-registry:
        condition: service_healthy
    command: bash -c "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data:/app/data
    networks:
      - ikg-network
      - crisalid-back
    profiles:
      - ikg
networks:
  ikg-network:
    driver: bridge
  crisalid-back:
    driver: bridge
volumes:
    org_registry_pgdata: