services:
  openwebui:
    # image: overridden by environment-specific YAML (docker-compose.dev.yaml / docker-compose.prod.yaml)
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT}:8080"
    volumes:
      - ./data:/app/backend/data
    environment:
      # Locale
      - DEFAULT_LOCALE=fr
      # Registration — disabled when Keycloak SSO is used; set to true only for password-only deployments
      - ENABLE_SIGNUP=false
      - DEFAULT_USER_ROLE=pending
      # Admin account seeding (applied on first run only, before any admin exists)
      - WEBUI_ADMIN_NAME=${OPENWEBUI_ADMIN_NAME}
      - WEBUI_ADMIN_EMAIL=${OPENWEBUI_ADMIN_EMAIL}
      - WEBUI_ADMIN_PASSWORD=${OPENWEBUI_ADMIN_PASSWORD}
      # Disabled features
      - ENABLE_CALENDAR=false
      - ENABLE_MEMORIES=false
      - ENABLE_NOTES=false
      - ENABLE_AUTOMATIONS=false
      - ENABLE_CHANNELS=false
      - ENABLE_COMMUNITY_SHARING=false
      - ENABLE_EVALUATION_ARENA_MODELS=false
      # OAuth2/OIDC (Keycloak SSO) — leave unset to disable SSO
      - ENABLE_OAUTH_SIGNUP=${OPENWEBUI_ENABLE_OAUTH_SIGNUP}
      - OAUTH_CLIENT_ID=${OPENWEBUI_OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OPENWEBUI_OAUTH_CLIENT_SECRET}
      - OPENID_PROVIDER_URL=${OPENWEBUI_OPENID_PROVIDER_URL}
      - OAUTH_PROVIDER_NAME=${OPENWEBUI_OAUTH_PROVIDER_NAME}
      - OPENID_REDIRECT_URI=${OPENWEBUI_OPENID_REDIRECT_URI}
    depends_on:
      crisalid-agents:
        condition: service_healthy
    networks:
      - agents-network
      - keycloak-network
    profiles:
      - openwebui
networks:
  agents-network:
    driver: bridge
  keycloak-network:
    external: true
