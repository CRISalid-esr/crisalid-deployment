services:
  cvs-os:
    # Single OpenSearch container embedding all vocabularies (one index per vocabulary).
    # Overriden by environment specific YAML configurations (e.g. docker-compose.dev.yaml)
    # image: crisalidesr/crisalid-vocab-search:os-latest
    expose:
      - "9200"
    # only if you want to access from host machine
    #ports: [ "9200:9200" ]
    # override the default 1g JVM heap if needed
    #environment:
    #  OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
    networks:
      crisalid-vocab-search-network:
        # The API image's vocab config targets http://os:9200
        aliases: [ os ]
    profiles:
      - cvs

  cvs-api:
    # Overriden by environment specific YAML configurations (e.g. docker-compose.dev.yaml)
    # image: crisalidesr/crisalid-vocab-search:api-1.0
    ports: [ "${CVS_API_PORT:-8000}:8000" ]
    environment:
      API_VERSION: ${API_VERSION:-v1}
    depends_on: [ cvs-os ]
    networks:
      - crisalid-vocab-search-network
      - svp-network
    profiles:
      - cvs

networks:
  crisalid-vocab-search-network:
    driver: bridge
  svp-network:
    driver: bridge
